name: Publish AstroVitals demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the project
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare the static demo files
        run: |
          mkdir -p dist/data
          cp index.html script.js style.css dist/
          cp data/nasa-iss-radiation.json dist/data/
          touch dist/.nojekyll
      - name: Upload the demo
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish the demo
        id: deployment
        uses: actions/deploy-pages@v4
